
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>- Bugtoe - Webcomics -</title>

  <style>
    /* CURSORS */
    body {
      cursor: url('Bugg.png') 0 0, auto;
    }

    a:hover {
      cursor: url('BuggHover.png') 0 0, auto;
    }

    a:active {
      cursor: url('BuggClick.png') 0 0, auto !important;
    }

    /* PAGE */
    body {
      margin: 0;
      padding-bottom: 100px;
      min-height: 100vh;
      background: white;
      color: black;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    /* LOGO */
    .logo-wrapper {
      width: 600px;
      height: 600px;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-main {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }

    /* TEXT AREA */
    .text-block {
      margin-top: -35px;
    }

    /* NORMAL TEXT */
    .normal-text {
      font-size: 32px;
      color: black;
      margin: 10px 0;
    }

    /* LINKS */
    .text-link {
      display: block;
      font-size: 24px;
      color: blue;
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <div class="logo-wrapper">
    <img src="Bugtoelogo.png" class="logo-main" alt="Bugtoe Logo">
  </div>

<!-- TEXT AND LINKS -->

<div class="text-block">

  <p style="font-size: 50px; color: black;">Welcome to bugtoe</p>
  
  <p style="font-size: 40px; color: black;">media type stuff</p>
  <a href="https://www.google.com" style="font-size: 30px; color: blue;">Google</a>

</div>


</body>
</html>
