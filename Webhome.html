
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bugtoe</title>

  <style>
    /* EASY SETTINGS */
    :root {
      --text-size: 32px;
      --text-spacing: 10px;
      --logo-size: 600px;
    }

    /* CURSORS */
    body {
      cursor: url('Bugg.png') 0 0, auto;
    }

    a:hover {
      cursor: url('BuggHover.png') 0 0, auto;
    }

    a:active {
      cursor: url('BuggClick.png') 0 0, auto !important;
    }

    /* PAGE */
    body {
      margin: 0;
      padding-bottom: 100px;
      min-height: 100vh;
      background: white;
      color: black;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    /* LOGO */
    .logo-wrapper {
      width: var(--logo-size);
      height: var(--logo-size);
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-main {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }

    /* TEXT AND LINKS */
    .text-block {
      margin-top: -35px;
      font-size: var(--text-size);
    }

    .text-link {
      font-size: var(--text-size);
      color: blue;
      display: block;
      margin-bottom: var(--text-spacing);
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <div class="logo-wrapper">
    <img src="Bugtoelogo.png" class="logo-main" alt="Bugtoe Logo">
  </div>

  <!-- LINKS: COPY A LINE TO ADD ANOTHER -->
  <div class="text-block">
    <a class="text-link" href="https://www.bugtoe.com/Webhome/pathfight/read">text</a>
    <a class="text-link" href="https://www.bugtoe.com/Webhome/pathfight/read">another text</a>
  </div>

</body>
</html>
