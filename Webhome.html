
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bugtoe</title>

  <style>
    /* CURSORS */
    body {
      cursor: url('Bugg.png') 0 0, auto;
    }

    a:hover {
      cursor: url('BuggHover.png') 0 0, auto;
    }

    a:active {
      cursor: url('BuggClick.png') 0 0, auto !important;
    }

    /* PAGE */
    body {
      margin: 0;
      padding-bottom: 100px;
      min-height: 100vh;
      background: #B8D4A3;
      color: #174D20;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    /* LOGO */
    .logo-wrapper {
      width: 600px;
      height: 600px;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-main {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }

    /* TEXT AREA - MOVED UP */
    .text-block {
      margin-top: -70px;
    }

    /* SMALLER GAPS */
    .text-block p {
      margin: 5px 0;
    }

    .text-block a {
      display: block;
      margin: 5px 0;
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <div class="logo-wrapper">
    <img src="Bugtoelogo.png" class="logo-main" alt="Bugtoe Logo">
  </div>

  <!-- TEXT AND LINKS -->
  <div class="text-block">

    <p style="font-size: 50px; color: #174D20;">Welcome to bugtoe</p>

    <p style="font-size: 40px; color: #174D20;">media type stuff</p>

    <a href="https://www.google.com" style="font-size: 30px; color: #A88700;">Google</a>
    <p style="font-size: 10px; color: #174D20;"></p>

    <a href="https://mail.google.com" style="font-size: 30px; color: #A88700;">Gmail</a>
    <p style="font-size: 10px; color: #174D20;"></p>

    <a href="https://www.youtube.com" style="font-size: 30px; color: #A88700;">Youtube</a>
    <p style="font-size: 10px; color: #174D20;"></p>

    <a href="https://www.pinterest.com" style="font-size: 30px; color: #A88700;">Pinterest</a>
    <p style="font-size: 10px; color: #174D20;"></p>

    <a href="https://www.netflix.com" style="font-size: 30px; color: #A88700;">Netflix</a>

    <p style="font-size: 30px; color: #174D20;">Extra</p>

    <a href="https://wheelofnames.com/" style="font-size: 20px; color: #A88700;">Wheel of names</a>
    <p style="font-size: 10px; color: #174D20;"></p>

    <a href="https://github.com" style="font-size: 20px; color: #A88700;">Github</a>
    <p style="font-size: 10px; color: #174D20;"></p>

    <a href="https://www.roblox.com" style="font-size: 20px; color: #A88700;">Roblox</a>

</body>
</html>
