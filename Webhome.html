
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>- Bugtoe - Webcomics -</title>

  <style>
    /* CURSORS */
    body {
      cursor: url('Bugg.png') 0 0, auto;
    }

    .interactive:hover {
      cursor: url('BuggHover.png') 0 0, auto;
    }

    .interactive:active {
      cursor: url('BuggClick.png') 0 0, auto !important;
    }

    /* PAGE */
    body {
      margin: 0;
      padding-bottom: 100px;
      min-height: 100vh;
      background: white;
      color: black;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    /* LOGO - NO ANIMATION */
    .logo-wrapper {
      width: 600px;
      height: 480px;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-main {
      width: 85%;
      height: 100%;
      object-fit: contain;
    }

    /* TEXT */
    .text-block {
      margin-top: -35px;
      text-align: center;
      font-size: 32px;
    }

    .text-block p {
      margin: 0 0 10px;
    }

    .interactive {
      font-size: 32px;
      color: blue;
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <div class="logo-wrapper">
    <img src="Bugtoelogo.png" class="logo-main" alt="Bugtoe Logo">
  </div>

  <!-- TEXT -->
  <div class="text-block">
    <p>text</p>

    <a
      href="https://www.bugtoe.com/Webhome/pathfight/read"
      class="interactive"
    >text</a>
  </div>

</body>
</html>
